name: deploy-prod

# Production deploy. Starts when a version tag vX.Y.Z is pushed (or by hand with "Run workflow").
# A human must press Approve: the job below uses the GitHub Environment "production" with REQUIRED REVIEWERS.
# There is no staging: it builds the artifact from the tag, then deploys it to the single production VM.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag to deploy, for example v1.0.0 (must be on main)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  gate:
    # Safe before any server exists: PROD_APPROVAL_CONFIRMED (repository variable) is empty until the owner has created the
    # production environment with Required reviewers. Empty = skip cleanly (green). Any other value than yes is an error in prepare.
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      enabled: ${{ steps.g.outputs.enabled }}
    steps:
      - id: g
        env:
          CONFIRMED: ${{ vars.PROD_APPROVAL_CONFIRMED }}
        run: |
          if [ -n "$CONFIRMED" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Production deploy skipped::repository variable PROD_APPROVAL_CONFIRMED is empty, so production is not set up yet. Nothing was deployed. See docs/PROD_GO_LIVE.md."
            echo "Production deploy skipped: production is not set up yet (PROD_APPROVAL_CONFIRMED empty)." >> "$GITHUB_STEP_SUMMARY"
          fi

  prepare:
    needs: gate
    if: needs.gate.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      id: ${{ steps.find.outputs.id }}
      tag: ${{ steps.find.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: find
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
          EVENT: ${{ github.event_name }}
          PUSHED_TAG: ${{ github.ref_name }}
          APPROVAL_CONFIRMED: ${{ vars.PROD_APPROVAL_CONFIRMED }}
        run: |
          set -euo pipefail
          TAG="$PUSHED_TAG"
          if [ "$EVENT" = workflow_dispatch ]; then TAG="$INPUT_TAG"; fi
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::tag must look like v1.2.3, got '$TAG'"; exit 1; }
          [ "$APPROVAL_CONFIRMED" = yes ] || { echo "::error::set the repository variable PROD_APPROVAL_CONFIRMED to yes only after the production environment has Required reviewers (docs/PROD_GO_LIVE.md, step G2)"; exit 1; }
          git fetch --tags --force origin
          SHA="$(git rev-list -n 1 "refs/tags/$TAG")"
          git merge-base --is-ancestor "$SHA" origin/main || { echo "::error::tag $TAG is not on main"; exit 1; }
          {
            echo "id=${SHA:0:12}"
            echo "tag=$TAG"
          } >> "$GITHUB_OUTPUT"
          echo "Deploying $TAG = commit $SHA" >> "$GITHUB_STEP_SUMMARY"

  build:
    # Builds the release once from the tag, for both CPU types.
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - id: id
        run: echo "id=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"
      - name: Build static Linux binaries for BOTH CPU types, so any host can be used (arm64 = Oracle Ampere, amd64 = most VPS)
        env:
          ID: ${{ steps.id.outputs.id }}
        run: |
          mkdir -p dist
          export GOOS=linux CGO_ENABLED=0
          for arch in arm64 amd64; do
            export GOARCH=$arch
            go build -trimpath -ldflags "-s -w -X github.com/Perrin-Nj/numerix-api/internal/app.Version=$ID" -o "dist/api-$arch" ./cmd/api
            rm -rf "dist/seed-$arch" && mkdir -p "dist/seed-$arch/bin" "dist/seed-$arch/scripts"
            go build -trimpath -ldflags "-s -w" -o "dist/seed-$arch/bin/seed" ./cmd/seed
            go build -trimpath -ldflags "-s -w" -o "dist/seed-$arch/bin/feedseed" ./cmd/feedseed
            go build -trimpath -ldflags "-s -w" -o "dist/seed-$arch/bin/loadtest" ./cmd/loadtest
            # the 45 MB of Discover media is copied by hand once per release, not part of the content seed
            tar -cf - --exclude=seed/feed-media seed | tar -xf - -C "dist/seed-$arch"
            cp scripts/db-prod-deploy.sh "dist/seed-$arch/scripts/"
            tar -czf "dist/seed-$arch.tgz" -C "dist/seed-$arch" .
            rm -rf "dist/seed-$arch"
          done
          (cd dist && sha256sum api-arm64 api-amd64 seed-arm64.tgz seed-amd64.tgz > SHA256SUMS && cat SHA256SUMS)
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ steps.id.outputs.id }}
          path: |
            dist/api-arm64
            dist/api-amd64
            dist/seed-arm64.tgz
            dist/seed-amd64.tgz
            dist/SHA256SUMS
          retention-days: 90
          if-no-files-found: error

  deploy:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      ID: ${{ needs.prepare.outputs.id }}
      API_URL: ${{ vars.API_URL }}
      # CPU type of THIS environment's host: arm64 (Oracle Ampere) or amd64 (most paid VPS). Set per environment.
      ARCH: ${{ vars.TARGET_ARCH || 'amd64' }}
      ACTIVATED: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: actions/download-artifact@v4
        with:
          name: release-${{ needs.prepare.outputs.id }}
          path: dist
      - uses: ./.github/actions/vm-ssh
        with:
          host: ${{ vars.DEPLOY_HOST }}
          user: ${{ vars.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          known-hosts: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
      - name: Check the settings
        run: '[[ "$API_URL" == https://* ]] || { echo "::error::variable API_URL must be the https address of the production API"; exit 1; }'
      - name: Verify the artifact is exactly what was built
        run: cd dist && sha256sum -c SHA256SUMS
      - name: Backup the database first
        run: |
          set -euo pipefail
          BACKUP="$(ssh nxvm backup | tail -1)"
          echo "BACKUP=$BACKUP" >> "$GITHUB_ENV"
          echo "database backup: $BACKUP" >> "$GITHUB_STEP_SUMMARY"
      - name: Install and activate (migrations run when the new binary starts)
        run: |
          set -euo pipefail
          SUM="$(grep " api-$ARCH\$" dist/SHA256SUMS | cut -d' ' -f1)"
          SEED_SUM="$(grep " seed-$ARCH.tgz\$" dist/SHA256SUMS | cut -d' ' -f1)"
          # shellcheck disable=SC2029
          ssh nxvm "put api $ID $SUM" < "dist/api-$ARCH"
          # shellcheck disable=SC2029
          ssh nxvm "put seed $ID $SEED_SUM" < "dist/seed-$ARCH.tgz"
          # shellcheck disable=SC2029
          if ssh nxvm "activate api $ID"; then
            echo "ACTIVATED=1" >> "$GITHUB_ENV"
          else
            STATUS="$(ssh nxvm status || true)"
            CURRENT="$(printf '%s\n' "$STATUS" | awk '$1 == "api" {sub(/^current=/, "", $2); print $2}')"
            if [ "$CURRENT" = "releases/$ID" ]; then echo "ACTIVATED=1" >> "$GITHUB_ENV"; fi
            exit 1
          fi
      - name: Roll back if activation failed partway through
        if: failure() && env.ACTIVATED == '1'
        run: |
          STATUS="$(ssh nxvm status || true)"
          CURRENT="$(printf '%s\n' "$STATUS" | awk '$1 == "api" {sub(/^current=/, "", $2); print $2}')"
          if [ "$CURRENT" = "releases/$ID" ]; then
            echo "::error::activation of API release $ID failed; restoring the prior release"
            ssh nxvm "rollback api"
            ssh nxvm "verify api" || true
          else
            echo "API release $ID is not active; no automatic rollback needed."
          fi
      - name: Health check, smoke test, automatic rollback
        run: |
          set -uo pipefail
          if ! ssh nxvm "verify api"; then
            echo "::error::new release never became healthy. Rolling back the binary AND restoring the pre-deploy database (nobody was served by the new release, so no family data is lost)."
            ssh nxvm "rollback api"
            # shellcheck disable=SC2029
            ssh nxvm "restore-db $BACKUP"
            ssh nxvm "verify api"
            exit 1
          fi
          if ! bash scripts/smoke-prod.sh "$API_URL" "$ID"; then
            echo "::error::smoke test failed after the release was serving. Rolling back the BINARY only. The database was NOT restored (it may hold new family data). Decide by hand: docs/PROD_GO_LIVE.md, section Rollback."
            ssh nxvm "rollback api"
            ssh nxvm "verify api"
            exit 1
          fi
      - name: Summary
        if: always()
        run: |
          {
            echo "### Production deploy of API \`${{ needs.prepare.outputs.tag }}\` (release \`$ID\`)"
            echo "- result: **${{ job.status }}**"
            echo "- database backup taken first: \`${BACKUP:-none}\`"
            echo "- content seed is a separate approval: run db-content.yml"
          } >> "$GITHUB_STEP_SUMMARY"
