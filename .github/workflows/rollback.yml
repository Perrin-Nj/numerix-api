name: rollback

# Manual. Puts the previous API release back (the VM keeps the last five). Uses the same approval gate as a deploy.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Which environment to roll back
        required: true
        type: choice
        options: [staging, production]
      restore_database:
        description: Also restore the newest pre-deploy database backup (loses everything written since it was taken)
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  rollback:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ inputs.environment }}
    env:
      API_URL: ${{ vars.API_URL }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/vm-ssh
        with:
          host: ${{ vars.DEPLOY_HOST }}
          user: ${{ vars.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          known-hosts: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
      - name: State before
        run: ssh nxvm status
      - name: Roll the binary back
        run: ssh nxvm "rollback api"
      - name: Restore the database (only when asked)
        if: ${{ inputs.restore_database }}
        run: |
          echo "::warning::restoring the newest pre-deploy database backup. Everything written since it was taken is lost."
          ssh nxvm "restore-db latest"
      - name: Health and smoke
        run: |
          set -euo pipefail
          ssh nxvm "verify api"
          bash scripts/smoke-prod.sh "$API_URL"
      - name: State after
        run: ssh nxvm status
