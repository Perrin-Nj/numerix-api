      x-roles:
        - parent
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - name: notificationId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Marked
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'
  /platform/public:
    get:
      tags:
        - Platform
      operationId: getPlatformPublic
      summary: Public platform settings (unpaid policy, card threshold, trial length, feature flags)
      description: Safe to cache for 5 minutes. No personal data. Read by the parent app to explain the paywall and by reminders.
      security: []
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: Public config
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformPublic'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'
  /config/public:
    get:
      tags:
        - Platform
      operationId: getPublicConfig
      summary: Admin-controlled app configuration (music defaults, voice, scenes, feature flags, maintenance banner, kid-visible copy)
      description: |
        No auth, no personal data. Edited by admins at runtime; the server caches it and answers
        `Cache-Control: public, max-age=60`. `version` changes whenever anything changes. The client uses it
        minimally: music defaults, feature flags and the maintenance banner. Any field it does not know is ignored.
      security: []
      responses:
        '200':
          description: Public config
          headers:
            Cache-Control:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppPublicConfig'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'
  /push/subscribe:
    post:
      tags:
        - Push
      operationId: subscribePush
      summary: Store the parent's Web Push subscription (VAPID)
      x-roles:
        - parent
      description: |
        Body is the browser `PushSubscription.toJSON()`. Upsert by `endpoint`: the same endpoint twice is
        one subscription. Returns 404, 405 or 501 while push is not built (the app then explains it).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PushSubscription'
            example:
              endpoint: https://fcm.googleapis.com/fcm/send/abc
              expirationTime: null
              keys:
                p256dh: BNc...
                auth: xyz...
      responses:
        '201':
          description: Stored
        '204':
          description: Already stored
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'
    delete:
      tags:
        - Push
      operationId: unsubscribePush
      summary: Remove a Web Push subscription (sign out, permission revoked, expired endpoint)
      x-roles:
        - parent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - endpoint
              properties:
                endpoint:
                  type: string
                  format: uri
      responses:
        '204':
          description: Removed or never existed
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'
  /children/{childId}/challenges:
    parameters:
