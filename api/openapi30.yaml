        - in_progress
        - mastered
        - needs_review
    JourneyNode:
      type: object
      required:
        - skill_id
        - label
        - state
        - position
      properties:
        skill_id:
          $ref: '#/components/schemas/SkillId'
        label:
          type: string
          description: Child-friendly title of the chapter
        state:
          $ref: '#/components/schemas/NodeState'
        locked_reason:
          type: string
          enum:
            - prerequisites
            - grade
          description: |
            Present only when `state` is `locked`. `prerequisites`: earlier chapters first. `grade`: the quest has fewer
            published questions than the playable threshold (8) for the child's school year, so it is shown but cannot
            be started yet (starting it answers 422 on `skill_id`). The client shows a soft locked node, never an error.
        position:
          type: object
          required:
            - row
            - col
          description: Layout slot on the winding path
          properties:
            row:
              type: integer
            col:
              type: integer
              minimum: 0
              maximum: 4
        level:
          type: integer
          minimum: 0
          maximum: 5
          description: How many times the child has revisited and kept it (0 = new). Shown as shine on the node, not as a score.
        next_review_at:
          type: string
          format: date-time
          nullable: true
        quest:
          description: The quest this node belongs to in the world (CR-18). Absent for skills played through a generator only.
          allOf:
            - $ref: '#/components/schemas/JourneyQuest'
        media:
          description: Icon of the quest when one is approved (CR-18)
          allOf:
            - $ref: '#/components/schemas/MediaRef'
    JourneyQuest:
      type: object
      required:
        - id
        - name
        - goal
      properties:
        id:
          type: string
          example: cuisine.fournee
        name:
          type: string
          example: La fournée de biscuits
        goal:
          type: string
          description: What the child practises
          in the request language: null
    Journey:
      type: object
      required:
        - world
        - nodes
      properties:
        world:
          $ref: '#/components/schemas/WorldId'
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/JourneyNode'
        current_skill_id:
          oneOf:
            - $ref: '#/components/schemas/SkillId'
            - type: 'null'
          description: The planner's suggestion for the big "play" button
    SessionStatus:
      type: string
      enum:
        - active
        - paused
        - completed
        - abandoned
    StartSessionRequest:
      type: object
      required:
        - world
        - kind
      properties:
        world:
          $ref: '#/components/schemas/WorldId'
        kind:
          type: string
          enum:
            - chapter
            - daily_quest
            - onboarding
        skill_id:
          description: Optional. Replay a specific node from the journey.
          oneOf:
            - $ref: '#/components/schemas/SkillId'
            - type: 'null'
    Session:
      type: object
      required:
        - id
        - child_id
        - world
        - kind
        - status
        - chapter_length
        - beats_answered
        - started_at
      properties:
        id:
          type: string
          format: uuid
        child_id:
          type: string
          format: uuid
        world:
          $ref: '#/components/schemas/WorldId'
        kind:
          type: string
          enum:
            - chapter
            - daily_quest
            - onboarding
        status:
          $ref: '#/components/schemas/SessionStatus'
        chapter_length:
          type: integer
          description: Planned number of beats. Data for the client; the play screen must not show a progress bar.
        beats_answered:
          type: integer
        current_beat:
          oneOf:
            - $ref: '#/components/schemas/Beat'
            - type: 'null'
          description: Open (unanswered) beat, if any
        story_title:
          type: string
          nullable: true
        variant_history:
          type: array
          maxItems: 30
          items:
            type: string
            maxLength: 64
          description: Scene ids the client showed most recently in this session (oldest first, 30 at most), as last sent on an answer. A reload keeps the no-repeat rule by reading this back.
        started_at:
          type: string
          format: date-time
        ended_at:
          type: string
          format: date-time
          nullable: true
        score:
          $ref: '#/components/schemas/Score'
          description: Required on the session inside `AnswerResult` and `SessionSummary`. Recommended on every session once one beat is answered, so the done screen survives a reload (the web app keeps the rewards in sessionStorage only).
    Score:
      type: object
      required:
        - correct
        - total
        - pct
        - threshold_pct
        - card_awarded
      description: |
        First-try score of a chapter. `correct` counts beats whose outcome is `correct`; `total` counts answered beats;
        `pct = round(1000 * correct / total) / 10` (one decimal, 0 when total is 0). `card_awarded` is true only
        when the chapter is completed and `pct >= threshold_pct`. The threshold is `PlatformConfig.card_threshold_pct`
        (default 70), echoed here so the client never recomputes it. The play screen must not show this object; only
        the done screen and the parent recap may.
      properties:
        correct:
          type: integer
          minimum: 0
        total:
          type: integer
          minimum: 0
        pct:
          type: number
          minimum: 0
          maximum: 100
        threshold_pct:
          type: integer
          minimum: 0
          maximum: 100
        card_awarded:
          type: boolean
      example:
        correct: 2
        total: 3
        pct: 66.7
        threshold_pct: 70
        card_awarded: false
    Challenge:
      type: object
      required:
        - id
        - title
        - description
        - target
        - progress
        - status
        - reward_label
        - emoji
      description: A challenge as the child sees it. The catalogue (ids, metrics, targets) is server data; the six launch challenges are in the guide.
      properties:
        id:
          type: string
          example: sharp_three
        title:
          type: string
          example: Triplé gagnant
        description:
          type: string
          example: Réponds juste 3 fois de suite.
        target:
          type: integer
          example: 3
        progress:
          type: integer
          description: Capped at target. Counts events after accepted_at only.
          example: 1
        status:
          type: string
          enum:
            - available
            - active
            - done
        reward_label:
          type: string
          example: Une carte rare
        emoji:
          type: string
          example: 🎯
        accepted_at:
          type: string
          format: date-time
          nullable: true
        card:
          oneOf:
            - $ref: '#/components/schemas/StoryCard'
            - type: 'null'
          description: Set when status is done
    PushSubscription:
      type: object
      required:
        - endpoint
        - keys
      description: Browser PushSubscription.toJSON()
      properties:
        endpoint:
          type: string
          format: uri
        expirationTime:
          type: number
          nullable: true
        keys:
          type: object
          required:
            - p256dh
            - auth
          properties:
            p256dh:
              type: string
            auth:
              type: string
    CheckoutResult:
      description: The subscription view, plus the processor's hosted page when payment is not instant.
      allOf:
        - $ref: '#/components/schemas/SubscriptionView'
        - type: object
          properties:
            checkout_url:
              type: string
              format: uri
              description: https only; the browser navigates to it
    Question:
      type: object
      required:
        - math_text
        - choices
      description: |
        Built by the engine or taken from the curated bank. Never contains the correct answer on its own, nor the
        explanation, the `calc` expression, the common errors or any misconception code (BE-67).
        A client that only knows `math_text` and four `choices` keeps working: generated questions are unchanged and
        curated questions fill `math_text` with the statement. `kind` tells which input to show:
        `numeric` (keypad; the answer may be [quotient, remainder] for a division with remainder), `choice` (2 to 5 cards,
        answer = the value of the chosen card), `truefalse` (two buttons, answer = boolean), `order` (answer = item ids
        in order), `match` (answer = [left id, right id] pairs), `word` and `visual` (numeric or choice), `estimate`
        (a number inside a range, or choice). An unknown `kind` should be shown as a numeric entry.
      properties:
        kind:
          $ref: '#/components/schemas/QuestionKind'
        math_text:
          type: string
          example: 340 ÷ 7 = ? (avec reste)
          description: Language neutral statement; for curated questions without one, the prompt text
        choices:
          type: array
          minItems: 0
          maxItems: 5
          description: Generated questions always send 4. Curated `choice`/`estimate` questions send 3 to 5; other kinds send none (CR-13).
          items:
            $ref: '#/components/schemas/AnswerValue'
        prompt:
          type: string
          description: What to answer
          in the request language (curated questions): null
        story:
          type: string
          description: Short story line of the question (curated questions); also the scene text
        items:
          $ref: '#/components/schemas/QuestionItems'
        visual:
          $ref: '#/components/schemas/QuestionVisual'
        media:
          type: array
          items:
            $ref: '#/components/schemas/QuestionMedia'
        hint_available:
          type: boolean
          description: True when POST .../hint will answer (BE-70)
    QuestionKind:
      type: string
      enum:
        - numeric
        - choice
        - truefalse
        - order
        - match
        - word
        - visual
        - estimate
    QuestionItem:
      type: object
      required:
        - id
        - text
      properties:
        id:
          type: string
        text:
          type: string
    QuestionItems:
      type: object
      description: Cards for `order` (`cards`, shown in a shuffled order) or the two columns of `match`.
      properties:
        cards:
          type: array
          items:
            $ref: '#/components/schemas/QuestionItem'
        left:
          type: array
          items:
            $ref: '#/components/schemas/QuestionItem'
        right:
          type: array
          items:
            $ref: '#/components/schemas/QuestionItem'
    QuestionVisual:
      type: object
      required:
        - kind
      description: Data for a picture the child reads (see seed/README.md in numerix-api for each data shape). No pixels, no answer.
      properties:
        kind:
          type: string
          enum:
            - bars
            - pictograph
            - clock
            - numberline
            - grid
            - fraction
            - dice
        data:
          type: object
          additionalProperties: true
    NarrationStatus:
      type: string
      enum:
        - pending
        - streaming
        - ready
        - fallback
    Narration:
      type: object
      required:
        - status
      description: |
        For a curated question the beat's `scene` is `ready` at once with the question's own story text and no model is
        called (CR-15); the narration stream then replays the same text. Generated questions keep the pending flow.
      properties:
        status:
          $ref: '#/components/schemas/NarrationStatus'
        text:
          type: string
          description: Full text when `ready` or `fallback`; null while pending
          nullable: true
        illustration_url:
          type: string
          format: uri
          nullable: true
    Beat:
      type: object
      required:
        - id
        - session_id
        - index
        - skill_id
        - question
        - scene
      properties:
        id:
          type: string
          format: uuid
        session_id:
          type: string
          format: uuid
        index:
          type: integer
          minimum: 0
        skill_id:
          $ref: '#/components/schemas/SkillId'
        question:
          $ref: '#/components/schemas/Question'
        scene:
          $ref: '#/components/schemas/Narration'
        scene_key:
          $ref: '#/components/schemas/SceneKey'
        created_at:
          type: string
          format: date-time
      example:
        id: 44444444-4444-4444-8444-444444444440
        session_id: 33333333-3333-4333-8333-333333333333
        index: 0
        skill_id: ARI-OPE-A06a
        question:
          math_text: 6 × 7 = ?
          choices:
            - 42
            - 13
            - 48
            - 36
        scene:
          status: pending
          text: null
          illustration_url: null
        scene_key: mult_div
        created_at: '2026-10-12T14:00:00Z'
    SceneKey:
      type: string
      maxLength: 80
      example: mult_div:MIS-MUL-001
      description: |
        Hint for the client to pick a consequence scene. It is the topic family (number, add_sub, mult_div, fractions,
        measure, geometry, data, time). On an `AnswerResult` for a typical error it is `<family>:<misconception id>`.
        Stable for a given question and answer; never shown to the child.
    AnswerRequest:
      type: object
      required:
        - answer
      properties:
        answer:
          $ref: '#/components/schemas/AnswerValue'
        response_time_ms:
          type: integer
          minimum: 0
          description: Used by mastery tracking only. Never displayed, never a timer.
        variant_history:
          type: array
          maxItems: 30
          items:
            type: string
            maxLength: 64
          description: Optional. The client's recent scene ids, oldest first. The server stores them on the session (last 30 kept) and returns them as `session.variant_history`, so a reload cannot reset the no-repeat rule. An omitted field leaves the stored list unchanged.
    Outcome:
      type: string
      description: |
        Verdict of the deterministic engine. Selects the story beat. The client
        must never render it as success/failure chrome (no red X).
      enum:
        - correct
        - erreur_typique
        - erreur_aleatoire
    Reward:
      type: object
      required:
        - type
      properties:
        type:
          type: string
          enum:
            - chapter_complete
            - card_earned
            - streak_extended
            - skill_mastered
            - daily_goal_met
        card:
          $ref: '#/components/schemas/StoryCard'
        streak_days:
          type: integer
        skill_id:
          $ref: '#/components/schemas/SkillId'
    AnswerResult:
      type: object
      required:
        - outcome
        - correct_answer
        - denouement
        - session
      properties:
        outcome:
          $ref: '#/components/schemas/Outcome'
        correct_answer:
          $ref: '#/components/schemas/AnswerValue'
        explain:
          type: string
          description: 'Curated questions only (BE-69): how to solve it, in the request language. Shown after answering, never before.'
          nullable: true
        misconception:
          type: string
          description: 'Curated questions only (BE-69): the matched typical error code when `outcome` is erreur_typique. For analytics and parent reports, not for display.'
          nullable: true
        feedback:
          type: string
          description: 'Curated questions only: the kind message written for the matched common error, when there is one.'
          nullable: true
        scene_key:
          $ref: '#/components/schemas/SceneKey'
        denouement:
          $ref: '#/components/schemas/Narration'
        session:
          $ref: '#/components/schemas/Session'
        rewards:
          type: array
          items:
            $ref: '#/components/schemas/Reward'
        method_visual:
          description: |
            How to solve this question, as data for an animated picture (no pixels). Sent for right and wrong answers
            alike, in the language of the request. Absent when no picture exists for the skill. The server builds it
            once per (kind, params, language) and reuses it for every child.
          allOf:
            - $ref: '#/components/schemas/MethodVisual'
      example:
        outcome: correct
        correct_answer: 42
        denouement:
          status: pending
          text: null
          illustration_url: null
        session:
          id: 33333333-3333-4333-8333-333333333333
          child_id: 11111111-1111-4111-8111-111111111111
          world: echecs
          kind: chapter
          status: completed
          chapter_length: 3
          beats_answered: 3
          current_beat: null
          story_title: Le tournoi des tours
          started_at: '2026-10-12T14:00:00Z'
          ended_at: '2026-10-12T14:00:00Z'
          score:
            correct: 3
            total: 3
            pct: 100
            threshold_pct: 70
            card_awarded: true
        rewards:
          - type: chapter_complete
          - type: card_earned
            card:
              id: 55555555-5555-4555-8555-555555555551
              world: echecs
              title: Le tournoi des tours
              image_url: ''
              session_id: 33333333-3333-4333-8333-333333333333
              earned_at: '2026-10-12T14:00:00Z'
          - type: skill_mastered
            skill_id: ARI-OPE-A06a
        method_visual:
          kind: equal_groups
          params:
            groups: 6
            size: 7
          steps:
            - caption: 6 groupes.
            - caption: 7 dans chaque groupe.
            - caption: 6 groupes de 7 font 42.
          alt: 6 groupes de 7 points font 42.
          cache_key: equal_groups:6,7:fr
    MethodVisual:
      type: object
      required:
        - kind
        - params
        - steps
        - alt
        - cache_key
      properties:
        kind:
          type: string
          enum:
            - add_carry
            - sub_borrow
            - equal_groups
            - equal_share
          description: |
            add_carry and sub_borrow take params {a, b} (place-value blocks, regroup ten ones into one ten, or break a ten).
            equal_groups takes {groups, size} (multiplication). equal_share takes {total, parts} (division, with remainder).
        params:
          type: object
          additionalProperties:
            type: integer
            minimum: 0
        steps:
          type: array
          minItems: 2
          maxItems: 4
          description: One short caption per animation step, in order. The client shows and speaks one at a time.
          items:
            type: object
            required:
              - caption
            properties:
              caption:
                type: string
                maxLength: 120
        alt:
          type: string
          description: One sentence describing the whole picture, for screen readers.
        cache_key:
          type: string
          description: Stable key for (kind, params, language). Equal keys mean an equal visual, so the client may cache it.
      example:
        kind: add_carry
        params:
          a: 36
          b: 19
        steps:
          - caption: 'On met les unités ensemble : 6 et 9 font 15.'
          - caption: Dix unités font une dizaine. On la déplace à gauche.
          - caption: 'Il reste 5 unités et 5 dizaines : 55.'
        alt: Des blocs montrent 36 plus 19. Dix unités deviennent une dizaine, le total est 55.
        cache_key: add_carry:36,19:fr
    SessionSummary:
