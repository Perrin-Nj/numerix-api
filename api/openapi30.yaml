        title:
          type: string
        image_url:
          type: string
          description: Empty until real art exists; the app then shows its placeholder art
        session_id:
          type: string
          format: uuid
        earned_at:
          type: string
          format: date-time
    FeedItem:
      type: object
      required:
        - id
        - kind
        - world
        - title
        - text
        - ai_generated
        - liked
        - saved
      properties:
        id:
          type: string
        kind:
          type: string
          enum:
            - story_short
            - fun_fact
            - puzzle
            - challenge
        world:
          $ref: '#/components/schemas/WorldId'
        title:
          type: string
        text:
          type: string
        ai_generated:
          type: boolean
          description: Always true. The UI shows an "AI generated" label.
          enum:
            - true
        generated_by:
          type: string
          example: pip
        author:
          type: object
          description: The storyteller persona that "wrote" the item (an AI character, never a real person).
          properties:
            name:
              type: string
              example: Pip
            emoji:
              type: string
              example: 🦊
        liked:
          type: boolean
        saved:
          type: boolean
        puzzle:
          oneOf:
            - $ref: '#/components/schemas/Question'
            - type: 'null'
          description: Present for kind=puzzle. Never contains the answer.
        cta:
          oneOf:
            - type: object
              required:
                - label
                - world
              properties:
                label:
                  type: string
                world:
                  $ref: '#/components/schemas/WorldId'
                skill_id:
                  $ref: '#/components/schemas/SkillId'
            - type: 'null'
    MediaItem:
      type: object
      description: One curated Discover item (a real photo, a short animation or a short captioned video). Texts are in the language of the request.
      required:
        - id
        - media_kind
        - title
        - caption
        - alt
        - world
        - topic
        - tags
        - grade_min
        - src
        - width
        - height
        - lqip
        - source_url
        - creator
        - licence
        - attribution
      properties:
        id:
          type: string
          description: Slug, stable. The item id used for reactions is `m-<id>`.
        media_kind:
          type: string
          enum:
            - photo
            - animation
            - video
        title:
          type: string
        caption:
          type: string
          description: The fun fact
          one or two short sentences.: null
        alt:
          type: string
          description: What the picture shows
          for screen readers.: null
        question:
          type: object
          description: Optional micro question. The child taps to reveal the answer; it is not graded and not stored.
          required:
            - prompt
            - answer
          properties:
            prompt:
              type: string
            answer:
              type: string
        world:
          $ref: '#/components/schemas/WorldId'
        topic:
          type: string
          description: counting, symmetry, patterns, shapes, fractions, measurement, time, multiplication, geometry, space, nature
        tags:
          type: array
          items:
            type: string
        grade_min:
          type: integer
          minimum: 1
          maximum: 6
          description: Lowest school year the item is meant for (shown from one year below).
        duration_ms:
          type: integer
          description: Set for animation and video.
        src:
          type: string
          description: Photo 960 px webp
          or the mp4 of an animation or video. Relative to the API base: null
          served by getFeedMedia.: null
        src_small:
          type: string
          description: Photo 480 px webp (data saver and small screens).
        poster:
          type: string
          description: Poster image of an animation or video (webp).
        width:
          type: integer
        height:
          type: integer
        lqip:
          type: string
          description: Tiny blurred placeholder as a data URI (blur-up).
        has_audio:
          type: boolean
          description: True when the video has a sound track. Videos start muted.
        captions:
          type: array
          description: WebVTT tracks of a video, fr-CA and en-CA. Captions describe what is shown.
          items:
            type: object
            required:
              - lang
              - label
              - src
            properties:
              lang:
                type: string
                example: fr-CA
              label:
                type: string
              src:
                type: string
        motion_note:
          type: string
          description: Set when the clip is a slow zoom on a photo; the UI labels it.
        source_url:
          type: string
          description: Page of the original work.
        creator:
          type: string
        licence:
          type: string
          example: CC BY 4.0
        licence_url:
          type: string
        attribution:
          type: string
          description: Credit line
          always shown on the card.: null
    DiscoverItem:
      type: object
      required:
        - id
        - kind
        - liked
        - saved
      properties:
        id:
          type: string
          description: '`m-<slug>` for media, `feed-<n>` for a puzzle.'
        kind:
          type: string
          enum:
            - photo
            - animation
            - video
            - puzzle
        liked:
          type: boolean
        saved:
          type: boolean
        media:
          $ref: '#/components/schemas/MediaItem'
        puzzle_item:
          $ref: '#/components/schemas/FeedItem'
    DiscoverPage:
      type: object
      required:
        - items
        - next_cursor
        - cycle
        - cycle_size
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DiscoverItem'
        next_cursor:
          type: string
          description: Opaque. Always set; the feed does not end.
        cycle:
          type: integer
          minimum: 0
          description: How many full passes over the items were completed before this page starts.
        cycle_size:
          type: integer
          description: How many media items fit the child's grade (one pass).
    FeedPage:
      type: object
      required:
        - items
        - next_cursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/FeedItem'
        next_cursor:
          type: string
          description: Always set; the feed never ends
    Home:
      type: object
      required:
        - suggested
        - quest
        - worlds
        - recent_cards
        - engagement
        - growth
      properties:
        suggested:
          type: object
          required:
            - world
            - label
          description: The big "continue" card. `open_session` is set when a chapter is already in progress.
          properties:
            world:
              $ref: '#/components/schemas/WorldId'
            skill_id:
              $ref: '#/components/schemas/SkillId'
            label:
              type: string
            open_session:
              oneOf:
                - $ref: '#/components/schemas/Session'
                - type: 'null'
        quest:
          $ref: '#/components/schemas/DailyQuest'
        worlds:
          type: array
          items:
            $ref: '#/components/schemas/World'
        recent_cards:
          type: array
          items:
            $ref: '#/components/schemas/StoryCard'
        engagement:
          $ref: '#/components/schemas/Engagement'
        growth:
          $ref: '#/components/schemas/Growth'
        gift_available:
          type: boolean
          description: True until the welcome gift is claimed (BE-20). The web app shows the gift overlay when true.
        active_challenges:
          type: integer
          description: Count of challenges not done, for the Challenges tab badge (BE-20).
    DailyQuest:
      type: object
      required:
        - available
        - completed
      properties:
        available:
          type: boolean
          description: False when no review is due
        completed:
          type: boolean
        skill_ids:
          type: array
          items:
            $ref: '#/components/schemas/SkillId'
