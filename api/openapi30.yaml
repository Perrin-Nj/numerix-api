                $ref: '#/components/schemas/StoryCard'
        '201':
          description: Gift claimed now
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoryCard'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'
  /account:
    get:
      tags:
        - Auth
      operationId: getAccount
      summary: The parent's own profile
      x-roles:
        - parent
      description: Not called by the web app yet. The account screen changes the language with a cookie only, so the backend never learns the parent's language (see known mismatches).
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: The account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'
    patch:
      tags:
        - Auth
      operationId: updateAccount
      summary: Change name or language
      x-roles:
        - parent
      description: The language decides the text of notifications and emails created later.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 80
                locale:
                  type: string
                  enum:
                    - fr-CA
                    - en-CA
            example:
              locale: en-CA
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: The account after the change
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'
    delete:
      tags:
        - Auth
      operationId: deleteAccount
      summary: Delete the parent and everything that belongs to the family
      x-roles:
        - parent
      description: Irreversible cascade (children, sessions, progress, subscription and processor customer, notifications, push subscriptions, tokens). Requires the password. Not called by the web app yet.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - password
              properties:
                password:
                  type: string
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '204':
          description: Deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'
  /auth/logout:
    post:
      tags:
        - Auth
      operationId: logoutParent
      summary: Revoke the parent's refresh token family
      x-roles:
        - parent
      description: |
        Sign out must revoke server side. The web app only clears its cookies today (see known mismatches),
        so the backend must also expire refresh tokens by itself. Idempotent; always 204.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token:
                  type: string
      responses:
        '204':
          description: Signed out
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'
  /auth/device:
    post:
      tags:
        - Auth
      operationId: deviceLogin
      summary: Open the app on a known device without signing in
      security: []
      description: |
        Reads the `nx_device` cookie (HttpOnly, Secure outside development, SameSite=Lax, Path=/, 180 days),
        rotates it (the answer carries a fresh `Set-Cookie`) and returns the same body as `/auth/refresh`.
        The cookie is set after register, login and passkey login. A missing, expired, revoked or reused
        cookie answers 401 and clears the cookie. No request body.
      responses:
        '200':
          description: New tokens (and a rotated `nx_device` cookie)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'
  /account/devices:
    get:
      tags:
        - Auth
      operationId: listDevices
      summary: Known devices of the parent
      x-roles:
        - parent
      description: Active devices only (not revoked, not expired). `current` marks the device that sent the cookie.
      responses:
        '200':
          description: The devices
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'
  /account/devices/{deviceId}:
    delete:
      tags:
        - Auth
      operationId: revokeDevice
      summary: Forget a device (its cookie stops working)
      x-roles:
        - parent
      parameters:
        - name: deviceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Revoked
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'
  /auth/passkeys/register/begin:
    post:
      tags:
        - Auth
      operationId: beginPasskeyRegistration
      summary: Start adding a passkey (WebAuthn creation options)
      x-roles:
        - parent
      description: Returns the `options` for `navigator.credentials.create` and a `session_id` valid 5 minutes. 503 `passkeys_unavailable` when the server has no WEBAUTHN_RP_ID.
      responses:
        '200':
          description: Creation options
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasskeyCeremony'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/Unavailable'
  /auth/passkeys/register/finish:
    post:
      tags:
        - Auth
      operationId: finishPasskeyRegistration
      summary: Finish adding a passkey
      x-roles:
        - parent
      description: Send the JSON of the credential returned by the browser (`PublicKeyCredential.toJSON()`). Errors use code `passkey_invalid` (422) or `passkey_session_expired` (410).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasskeyFinishRequest'
      responses:
        '201':
          description: Passkey stored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Passkey'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '410':
          $ref: '#/components/responses/Gone'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/Unavailable'
  /auth/passkeys/login/begin:
    post:
      tags:
        - Auth
      operationId: beginPasskeyLogin
      summary: Start a passkey sign in (discoverable credential, no username)
      security: []
      description: Returns the `options` for `navigator.credentials.get` and a `session_id` valid 5 minutes.
      responses:
        '200':
          description: Request options
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasskeyCeremony'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/Unavailable'
  /auth/passkeys/login/finish:
    post:
      tags:
        - Auth
      operationId: finishPasskeyLogin
      summary: Finish a passkey sign in
      security: []
      description: Same answer as `/auth/login`, plus the `nx_device` cookie. Refused signatures, unknown credentials and a sign counter that goes backwards all answer 401.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasskeyFinishRequest'
      responses:
        '200':
          description: Signed in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '410':
          $ref: '#/components/responses/Gone'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/Unavailable'
  /account/passkeys:
    get:
      tags:
        - Auth
      operationId: listPasskeys
      summary: Passkeys of the parent
      x-roles:
        - parent
      responses:
        '200':
          description: The passkeys
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasskeyList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'
  /account/passkeys/{passkeyId}:
    delete:
      tags:
        - Auth
      operationId: deletePasskey
      summary: Remove a passkey
      x-roles:
        - parent
      parameters:
        - name: passkeyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Removed
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'
  /assets/{file}:
    get:
      tags:
        - Catalog
      operationId: getAsset
      summary: One image (CR-17, BE-71)
      security: []
      description: |
        `a_<20 hex>.webp` is the widest variant, `a_<20 hex>-<w>.webp` the variant of width `w` (a `MediaRef.srcset`
        entry). The id is a hash of the image, so the answer never changes: `Cache-Control: public, max-age=31536000,
        immutable`, a strong `ETag`, and 304 for `If-None-Match`. Unknown, unapproved or unsafe assets are 404.
        In the web app this path is rewritten from `/assets/*` so the browser and the CDN see the immutable headers.
      parameters:
        - name: file
          in: path
          required: true
          schema:
            type: string
            pattern: ^a_[0-9a-f]{20}(-[0-9]+)?\.webp$
        - name: If-None-Match
          in: header
          required: false
          schema:
            type: string
      responses:
        '200':
          description: The image
          headers:
            ETag:
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
          content:
            image/webp:
              schema:
                type: string
                format: binary
        '304':
          description: Not modified
          headers:
            ETag:
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'
  /credits:
    get:
      tags:
        - Catalog
      operationId: listCredits
      summary: Attributions required by the images in use (CR-17)
      security: []
      description: One entry per approved image whose licence asks for a credit. Printed on the credits page of the parent area.
      responses:
        '200':
          description: Credits
          headers:
            Cache-Control:
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/CreditItem'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'
  /health:
    get:
      tags:
        - Ops
      operationId: health
      summary: Liveness, with the narrator state
      description: Cheap, no database call. The Next app reads it through `/api/health` to tell "our backend is down" from "your connection is down".
      security: []
      responses:
        '200':
          description: Healthy
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    type: string
                    enum:
                      - ok
                      - degraded
                  narrator:
                    type: string
                    enum:
                      - llm
                      - stub
                      - down
                  version:
                    type: string
                    example: 1.4.2
              example:
                status: ok
                narrator: llm
                version: 1.4.2
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'
  /ready:
    get:
      tags:
        - Ops
      operationId: ready
      summary: Readiness (database, cache, engine, narrator)
      description: Returns 503 with the failing check names when the service must not receive traffic. Used by the platform load balancer, not by the web app.
      security: []
      responses:
        '200':
          description: Ready
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - checks
                properties:
                  status:
                    type: string
                    enum:
                      - ok
                  checks:
                    type: object
                    additionalProperties:
                      type: string
                      enum:
                        - ok
                        - degraded
              example:
                status: ok
                checks:
                  database: ok
                  cache: ok
                  engine: ok
                  narrator: ok
        '503':
          description: Not ready
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                      - down
                  checks:
                    type: object
                    additionalProperties:
                      type: string
                      enum:
                        - ok
                        - degraded
                        - down
  /events:
    post:
      tags:
        - Ops
      operationId: sendEvents
      summary: Batch of privacy-safe UI events (no names, no free text)
      description: |
        Product analytics. Not called by the web app yet (the `NEXT_PUBLIC_ANALYTICS_ENABLED` flag exists
        but no sender is wired). Never accept names, emails, free text or ids of other people in `props`.
        Drop unknown `name` values silently, always answer 202.
      x-roles:
        - parent
        - child
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - events
              properties:
                events:
                  type: array
                  maxItems: 100
                  items:
                    type: object
                    required:
                      - name
                      - at
                    properties:
                      name:
                        type: string
                        example: world_picker_opened
                      at:
                        type: string
                        format: date-time
                      props:
                        type: object
                        additionalProperties: {}
      responses:
        '202':
          description: Accepted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    ChildId:
      name: childId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SessionId:
      name: sessionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    BeatId:
      name: beatId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Client-generated UUID. A retry with the same key returns the first result.
      schema:
        type: string
        format: uuid
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
    AcceptLanguage:
      name: Accept-Language
      in: header
      required: false
      description: fr-CA or en-CA. The app forwards the NEXT_LOCALE cookie, else the browser header. Default fr-CA.
      schema:
        type: string
        example: fr-CA
  responses:
    Unauthorized:
      description: Missing or invalid token
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: Wrong role, wrong PIN, or not your child
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: No such resource
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: State conflict
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ValidationError:
      description: Invalid request body (code validation_failed, with `errors[]` per field)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    RateLimited:
      description: Too many requests (code rate_limited). Send `Retry-After` in seconds.
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ServerError:
      description: Unexpected failure (code internal_error). Never leak stack traces or model output.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Gone:
      description: The passkey ceremony expired (code passkey_session_expired); start again
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unavailable:
      description: Feature not configured on this server (code passkeys_unavailable)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Problem:
      type: object
      description: RFC 9457 problem details
      required:
        - type
        - title
        - status
      properties:
        type:
          type: string
          example: https://numerix.app/problems/consent-missing
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        code:
          type: string
          description: |
            Stable machine code the UI switches on. Vocabulary (guide, error catalogue):
            unauthorized, forbidden, forbidden_origin, not_found, validation_failed, rate_limited, internal_error,
            consent_missing, daily_limit_reached, session_active, session_paused, session_completed,
            beat_answered, beat_not_answered, invalid_pin, subscription_inactive, account_blocked,
            not_cancelable, conflict, email_taken, passkey_invalid, passkey_session_expired,
            passkey_exists, passkey_limit, passkeys_unavailable.
          example: consent_missing
        retry_after_seconds:
          type: integer
          description: On 429 and 503. Also sent as header Retry-After, but the Next proxy forwards only content-type and cache-control, so the body copy is the one the app can read.
        i18n:
          type: object
          description: Optional ready-made copy in both languages (used by subscription_inactive and account_blocked).
          properties:
            fr:
              type: object
              properties:
                title:
                  type: string
                detail:
                  type: string
            en:
              type: object
              properties:
                title:
                  type: string
                detail:
                  type: string
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string
      example:
        type: https://numerix.app/problems/subscription-inactive
        title: A little break for now
        status: 402
        code: subscription_inactive
        detail: Your family's subscription is paused.
        i18n:
          fr:
            title: Petite pause pour l’instant
            detail: L’abonnement de ta famille est en pause.
          en:
            title: A little break for now
            detail: Your family's subscription is paused.
    WorldId:
      type: string
      description: |
        The twenty story worlds. The first eight are the original worlds; the other twelve came with the question bank
        (CR-11). A client must treat an id it does not know as a generic world (accent colour and name come from
        `GET /worlds`), so a new world never needs a release.
      enum:
        - nature
        - espace
        - cuisine
        - sport
        - construction
        - medecine
        - science
        - echecs
        - ocean
        - dinosaures
        - animaux
        - musique
        - transport
        - pirates
        - marche
        - meteo
        - robots
        - arts
        - hiver
        - jeux
    SkillId:
      type: string
      description: PDA skill id from the curriculum graph
      example: ARI-OPE-A07a
    AnswerValue:
      oneOf:
        - type: integer
        - type: number
        - type: string
        - type: boolean
        - type: array
          minItems: 2
          maxItems: 2
          items:
            type: integer
        - type: array
          items:
            type: string
        - type: array
          items:
            type: array
            minItems: 2
            maxItems: 2
            items:
              type: string
      example: 48
    MediaRef:
      type: object
      required:
        - id
        - alt
        - width
        - height
        - color
        - lqip
        - srcset
      properties:
        id:
          type: string
          example: a_3f9c0b7e21d4a85c6e10
        alt:
          type: string
          description: Describes what is visible
          in the request language. Never hints at an answer.: null
        width:
          type: integer
          description: Width of the largest variant
        height:
          type: integer
        color:
          type: string
          pattern: ^#[0-9a-fA-F]{6}$
          description: Dominant colour
          use it as the background while loading: null
        lqip:
          type: string
          description: 'Tiny blurred preview as a data: URI (webp)'
        srcset:
          type: array
          items:
            type: object
            required:
              - w
              - url
            properties:
              w:
                type: integer
              url:
                type: string
                description: Path under the asset base (default /assets), for example /assets/a_3f9c0b7e21d4a85c6e10-960.webp
        credit:
          description: Present when the licence asks for attribution. Show it near the image or on the credits page.
          allOf:
            - $ref: '#/components/schemas/MediaCredit'
    MediaCredit:
      type: object
      required:
        - text
        - licence
      properties:
        text:
          type: string
          example: Photo by Jane Doe on Pexels
        source_url:
          type: string
        licence:
          type: string
          example: PEXELS
        licence_url:
          type: string
    QuestionMedia:
      type: object
      required:
        - role
        - image
      properties:
        role:
          type: string
          description: scene, object, visual or choice:<id>
        image:
          $ref: '#/components/schemas/MediaRef'
    CreditItem:
      type: object
      required:
        - id
        - url
        - text
        - licence
      properties:
        id:
          type: string
        url:
          type: string
          description: Thumbnail path
        text:
          type: string
        source_url:
          type: string
        licence:
          type: string
        licence_url:
          type: string
    RegisterRequest:
      type: object
      required:
        - email
        - password
        - locale
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 10
        locale:
          type: string
          enum:
            - fr-CA
            - en-CA
          default: fr-CA
    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
    AuthSession:
      type: object
      required:
        - access_token
        - refresh_token
        - expires_in
        - parent
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        expires_in:
          type: integer
          description: Seconds
        parent:
          type: object
          required:
            - id
            - email
            - locale
          properties:
            id:
              type: string
              format: uuid
            email:
              type: string
              format: email
            locale:
              type: string
    Account:
      type: object
      required:
        - id
        - email
        - name
        - locale
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
        locale:
          type: string
          enum:
            - fr-CA
            - en-CA
        email_verified:
          type: boolean
        created_at:
          type: string
          format: date-time
    ConsentRequest:
      type: object
      required:
        - child_id
        - version
        - accepted
      properties:
        child_id:
          type: string
          format: uuid
        version:
          type: string
          description: Version of the privacy notice shown
          example: 2026-10
        accepted:
          type: boolean
          enum:
            - true
    Child:
      type: object
      required:
        - id
        - display_name
        - grade
        - avatar_id
        - has_pin
        - consent_given
      properties:
        id:
          type: string
          format: uuid
        display_name:
          type: string
          maxLength: 30
          description: First name or nickname only
        birth_year:
          type: integer
        grade:
          type: integer
          minimum: 1
          maximum: 4
          description: Quebec primary year covered today
        avatar_id:
          type: string
        has_pin:
          type: boolean
        consent_given:
          type: boolean
        favorite_world:
          oneOf:
            - $ref: '#/components/schemas/WorldId'
            - type: 'null'
        timezone:
          type: string
          example: America/Toronto
          description: IANA zone; day boundary for streak and daily goal
        onboarding_completed:
          type: boolean
        created_at:
          type: string
          format: date-time
      example:
        id: 11111111-1111-4111-8111-111111111111
        display_name: Zoé
        birth_year: 2018
        grade: 3
        avatar_id: fox
        has_pin: true
        consent_given: true
        favorite_world: echecs
        timezone: America/Toronto
        onboarding_completed: false
        created_at: '2026-10-12T14:00:00Z'
    ChildCreate:
      type: object
      required:
        - display_name
        - grade
        - avatar_id
      properties:
        display_name:
          type: string
          maxLength: 30
        birth_year:
          type: integer
        grade:
          type: integer
          minimum: 1
          maximum: 4
        avatar_id:
          type: string
        timezone:
          type: string
        pin:
          type: string
          pattern: ^[0-9]{4}$
    ChildUpdate:
      type: object
      properties:
        display_name:
          type: string
          maxLength: 30
        grade:
          type: integer
          minimum: 1
          maximum: 4
        avatar_id:
          type: string
        onboarding_completed:
          type: boolean
        timezone:
          type: string
          description: IANA zone; changes the day boundary from the next day on
        pin:
          type: string
          pattern: ^[0-9]{4}$
          nullable: true
    ChildToken:
      type: object
      required:
        - access_token
        - expires_in
        - child
      properties:
        access_token:
          type: string
        expires_in:
          type: integer
        child:
          $ref: '#/components/schemas/Child'
    ChildSettings:
      type: object
      required:
        - daily_goal_chapters
        - enabled_worlds
        - read_aloud
        - sound
      properties:
        daily_goal_chapters:
          type: integer
          minimum: 1
          maximum: 5
          default: 1
        daily_time_limit_minutes:
          type: integer
          minimum: 5
          maximum: 180
          nullable: true
        enabled_worlds:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/WorldId'
        read_aloud:
          type: boolean
          description: Narration is spoken (reading levels vary from age 6 to 11)
        sound:
          type: boolean
        remember_on_device:
          type: boolean
          default: false
          description: When true, a valid nx_device cookie lets this child start without the PIN on that device (BE-64)
        kid_can_change_language:
          type: boolean
          default: true
          description: When false the kid app hides the language switch; the server returns the value with the settings (BE-28)
        music:
          $ref: '#/components/schemas/MusicSettings'
        voice:
          $ref: '#/components/schemas/VoiceSettings'
      example:
        daily_goal_chapters: 1
        daily_time_limit_minutes: null
        enabled_worlds:
          - nature
          - espace
          - cuisine
          - sport
          - construction
          - medecine
          - science
          - echecs
        read_aloud: true
        sound: true
        kid_can_change_language: true
        music:
          enabled: true
          volume: 30
          parent_locked: false
        voice:
          human_enabled: true
          computer_voice: false
    MusicSettings:
      type: object
      required:
        - enabled
        - volume
        - parent_locked
      description: Background music. Optional on write (an omitted block keeps the stored one); always present on read.
      properties:
        enabled:
          type: boolean
          default: true
          description: The child toggle. Always false while parent_locked is true.
        volume:
          type: integer
          minimum: 0
          maximum: 100
          default: 30
        parent_locked:
          type: boolean
          default: false
          description: 'Parent switch: music stays off and the child cannot turn it on. Only a parent token can change it.'
    VoiceSettings:
      type: object
      required:
        - human_enabled
        - computer_voice
      description: Read-aloud voice. Optional on write (an omitted block keeps the stored one); always present on read.
      properties:
        human_enabled:
          type: boolean
          default: true
          description: Play the recorded human clip when one exists
        computer_voice:
          type: boolean
          default: false
          description: Parent opt-in to the browser computer voice when no human clip exists. Only a parent token can change it.
    Device:
      type: object
      required:
        - id
        - label
        - user_agent_family
        - created_at
        - last_used_at
        - current
      properties:
        id:
          type: string
          format: uuid
        label:
          type: string
          description: Browser and system, for example "Chrome on Windows"
        user_agent_family:
          type: string
          description: Browser family only (Chrome, Safari, Firefox, Edge, Other); never the full user agent
        created_at:
          type: string
          format: date-time
        last_used_at:
          type: string
          format: date-time
        current:
          type: boolean
          description: This request carries this device's cookie
    DeviceList:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Device'
    Passkey:
      type: object
      required:
        - id
        - nickname
        - transports
        - backup_eligible
        - backup_state
        - created_at
      properties:
        id:
          type: string
          format: uuid
        nickname:
          type: string
          maxLength: 60
        aaguid:
          type: string
          description: Authenticator model id (hex
          32 chars): null
        transports:
          type: array
          items:
            type: string
        backup_eligible:
          type: boolean
          description: Synced passkey (can be backed up)
        backup_state:
          type: boolean
          description: Currently backed up
        created_at:
          type: string
          format: date-time
        last_used_at:
          type: string
          format: date-time
          nullable: true
    PasskeyList:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Passkey'
    PasskeyCeremony:
      type: object
      required:
        - session_id
        - options
      properties:
        session_id:
          type: string
          description: Send it back to the matching finish call; valid 5 minutes
        options:
          type: object
          additionalProperties: true
          description: WebAuthn options (publicKey) as JSON, to pass to navigator.credentials
    PasskeyFinishRequest:
      type: object
      required:
        - session_id
        - credential
      properties:
        session_id:
          type: string
        nickname:
          type: string
          maxLength: 60
          description: Registration only
        credential:
          type: object
          additionalProperties: true
          description: JSON of the PublicKeyCredential from the browser
    PaymentMethod:
      type: string
      enum:
        - card
        - interac
        - paypal
        - apple_pay
        - google_pay
    SubscriptionView:
      type: object
      required:
        - status
        - plan
        - can_play
      properties:
        status:
          type: string
          enum:
            - trial
            - active
            - unpaid
            - expired
            - canceled
          description: Effective status (a trial or paid period that ended reads expired)
        plan:
          type: string
          enum:
            - free
            - family_monthly
            - family_yearly
        method:
          $ref: '#/components/schemas/PaymentMethod'
        renews_at:
          type: string
          format: date-time
        trial_ends_at:
          type: string
          format: date-time
        marked_by_admin:
          type: boolean
        can_play:
          type: boolean
          description: The subscription alone allows play (trial running, paid period running, or canceled but not ended). The start gate is can_play OR unpaid_policy allow, and a blocked parent is always refused.
        days_left:
          type: integer
          description: Whole days, rounded up, until trial_ends_at or renews_at; null when there is no end
          nullable: true
      example:
        status: trial
        plan: free
        trial_ends_at: '2026-10-26T14:00:00Z'
        can_play: true
        days_left: 14
    PlanCatalog:
      type: object
      required:
        - currency
        - plans
        - methods
      properties:
        currency:
          type: string
          example: CAD
        plans:
          type: array
          items:
            type: object
            required:
              - id
              - price_cad_cents
              - period
              - name
              - features
            properties:
              id:
                type: string
                enum:
                  - free
                  - family_monthly
                  - family_yearly
              price_cad_cents:
                type: integer
              period:
                type: string
                enum:
                  - none
                  - month
                  - year
              name:
                type: object
                properties:
                  fr:
                    type: string
                  en:
                    type: string
              features:
                type: object
                properties:
                  fr:
                    type: array
                    items:
                      type: string
                  en:
                    type: array
                    items:
                      type: string
        methods:
          type: array
          items:
            type: object
            required:
              - id
              - label
            properties:
              id:
                $ref: '#/components/schemas/PaymentMethod'
              label:
                type: object
                properties:
                  fr:
                    type: string
                  en:
                    type: string
    Notification:
      type: object
      required:
        - id
        - kind
        - title
        - body
        - created_at
        - read
        - audience
      properties:
        id:
          type: string
        kind:
          type: string
          enum:
            - play_reminder
            - time_limit
            - subscription_expiring
            - payment_due
            - announcement
        title:
          type: string
        body:
          type: string
        created_at:
          type: string
          format: date-time
        read:
          type: boolean
        audience:
          type: string
          enum:
            - parent
            - child
      example:
        id: nt-1
        kind: play_reminder
        title: C’est l’heure d’une petite aventure
        body: Un chapitre de 10 minutes attend votre enfant.
        created_at: '2026-10-12T14:00:00Z'
        read: false
        audience: parent
    PlatformPublic:
      type: object
      required:
        - unpaid_policy
        - card_threshold_pct
      properties:
        unpaid_policy:
          type: string
          enum:
            - block
            - allow
        card_threshold_pct:
          type: integer
          minimum: 0
          maximum: 100
        trial_days:
          type: integer
        default_locale:
          type: string
        expiring_warning_days:
          type: integer
          description: Days before the end of a trial or canceled period that trigger subscription_expiring
        reminder_hour_local:
          type: integer
          minimum: 0
          maximum: 23
          description: Local hour after which a play reminder is allowed
        daily_time_limit_minutes_default:
          type: integer
          description: Default daily limit for new children
          nullable: true
        features:
          type: object
          additionalProperties:
            type: boolean
      example:
        unpaid_policy: block
        card_threshold_pct: 70
        trial_days: 14
        default_locale: fr-CA
        expiring_warning_days: 7
        reminder_hour_local: 17
        daily_time_limit_minutes_default: 60
        features:
          feed: true
          challenges: true
          push: false
          payments: true
    BilingualText:
      type: object
      required:
        - fr
        - en
      properties:
        fr:
          type: string
          maxLength: 280
        en:
          type: string
          maxLength: 280
    AppPublicConfig:
      type: object
      required:
        - version
        - music
        - voice
        - scenes
        - features
        - welcome_gift
        - feed
        - maintenance
        - copy
      properties:
        version:
          type: integer
          minimum: 0
          description: Sum of the versions of every config document; changes on any edit
        music:
          type: object
          required:
            - enabled
            - default_volume
            - tracks
          properties:
            enabled:
              type: boolean
            default_volume:
              type: integer
              minimum: 0
              maximum: 100
            tracks:
              type: array
              description: Enabled tracks only
              items:
                type: object
                required:
                  - id
                  - title
                properties:
                  id:
                    type: string
                  title:
                    $ref: '#/components/schemas/BilingualText'
        voice:
          type: object
          required:
            - human_enabled_default
            - computer_voice_allowed
            - clips
          properties:
            human_enabled_default:
              type: boolean
            computer_voice_allowed:
              type: boolean
            clips:
              type: array
              description: Enabled recorded lines managed by the admin (the static voice manifest stays the base)
              items:
                type: object
                required:
                  - line_id
                  - locale
                  - url
                  - enabled
                properties:
                  line_id:
                    type: string
                  locale:
                    type: string
                    enum:
                      - fr-CA
                      - en-CA
                  url:
                    type: string
                  enabled:
                    type: boolean
        scenes:
          type: object
          required:
            - physics_enabled
            - families
          properties:
            physics_enabled:
              type: boolean
              description: 'false: play the plain animation, no simulation'
            families:
              type: object
              additionalProperties:
                type: object
                required:
                  - enabled
                  - disabled_variants
                properties:
                  enabled:
                    type: boolean
                  disabled_variants:
                    type: array
                    items:
                      type: string
        features:
          type: object
          additionalProperties:
            type: boolean
        welcome_gift:
          type: boolean
        feed:
          type: object
          required:
            - discover_enabled
            - family_board_visible
          properties:
            discover_enabled:
              type: boolean
            family_board_visible:
              type: boolean
        maintenance:
          type: object
          required:
            - enabled
            - level
            - message
            - block_play
          properties:
            enabled:
              type: boolean
            level:
              type: string
              enum:
                - info
                - warning
                - critical
            message:
              $ref: '#/components/schemas/BilingualText'
            block_play:
              type: boolean
              description: 'true: game requests answer 503 maintenance'
        copy:
          type: object
          required:
            - home_tip
            - feed_empty
            - session_done
          properties:
            home_tip:
              $ref: '#/components/schemas/BilingualText'
            feed_empty:
              $ref: '#/components/schemas/BilingualText'
            session_done:
              $ref: '#/components/schemas/BilingualText'
    World:
      type: object
      required:
        - id
        - name
        - tagline
        - image_url
        - accent_color
        - skill_count
      properties:
        id:
          $ref: '#/components/schemas/WorldId'
        name:
          type: string
          example: Échecs
        tagline:
          type: string
        image_url:
          type: string
          description: Path of the hero image (largest variant). Empty when the world has no approved hero yet; the app then draws a gradient from accent_color
        accent_color:
          type: string
          pattern: ^#[0-9a-fA-F]{6}$
        hook:
          type: string
          description: One short teaser line shown on the home feed
        skill_count:
          type: integer
        grade_min:
          type: integer
          minimum: 1
          maximum: 6
          description: First school year the world serves (CR-12)
        grade_max:
          type: integer
          minimum: 1
          maximum: 6
        hero:
          description: Hero image with its responsive sizes (CR-12). Absent when the world has no approved hero yet.
          allOf:
            - $ref: '#/components/schemas/MediaRef'
        scenes:
          type: array
          description: A few scene images of the world for the world page (CR-12). Empty until art is approved.
          items:
            $ref: '#/components/schemas/MediaRef'
    Skill:
      type: object
      required:
