openapi: 3.0.3
info:
  title: Numerix API
  version: 0.1.0
  summary: Contract between the Next.js app and the Numerix backend.
  description: |
    Source of truth for the frontend and the backend. TypeScript types are
    generated from this file; the Go API (`../numerix-api`) is the reference server and is checked
    against it.

    **The one rule (see docs/NUMERIX_CONTEXT.md):** the LLM never does math.
    The deterministic engine builds the problem and rules on the answer.
    Consequences for this contract:
    - A `Beat` never contains the correct answer. It is revealed only in the
      `AnswerResult` returned after the child answers.
    - Narration text comes from the LLM and is never an input to grading.

    **Game feel:** Duolingo-like structure outside play (journey map, story-day
    streak, story cards, daily goal, own-past growth), story-only inside play.
    There are deliberately no hearts or lives, no XP, no leagues or
    leaderboards, and no timers. Wrong answers carry no failure flag: the
    child-facing `outcome` only selects which story beat to show.

    **Roles.** `parent` tokens manage accounts and read reports. `child` tokens
    (obtained with `POST /children/{childId}/token`) can only play: journey,
    sessions, collection. Each operation lists its role in `x-roles`.

    **Where to start.** `contracts/BACKEND_INTEGRATION.md` explains behaviour, trust
    boundaries, state machines and the acceptance checklist. This file is the
    machine-readable shape. The platform admin API lives in `openapi.admin.yaml`
    (bearer `ADMIN_API_TOKEN`, never reachable from the kid origin).

    **Common rules.**
    - Errors are `application/problem+json` with a stable `code` (see `Problem`).
      Every operation can also answer 401, 403, 429 and 500 (added to each operation).
    - `Accept-Language` (`fr-CA` or `en-CA`) selects the language of every
      localized string (worlds, skills, journey labels, narration, notifications, problem text).
    - `Idempotency-Key` is required on `startSession`, `nextBeat` and `answerBeat`.
    - Dates are ISO 8601 UTC. Ids are UUID v4 unless noted (feed items and notifications use opaque strings).
    - Cursor lists answer `{items, next_cursor}`; `next_cursor` is null at the end.
servers:
  - url: http://localhost:8000/v1
    description: Local development
  - url: http://localhost:8081/v1
    description: Numerix Go API
tags:
  - name: Auth
  - name: Children
  - name: Catalog
  - name: Journey
  - name: Sessions
  - name: Progress
  - name: Engagement
  - name: Challenges
  - name: Parent
  - name: Platform
  - name: Push
  - name: Ops
security:
  - bearerAuth: []
paths:
  /auth/register:
    post:
      tags:
        - Auth
      operationId: registerParent
      summary: Create a parent account
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Account created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'
  /auth/login:
    post:
      tags:
        - Auth
      operationId: loginParent
      summary: Log a parent in
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Logged in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'
  /auth/refresh:
    post:
      tags:
        - Auth
      operationId: refreshToken
      summary: Exchange a refresh token for a new access token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - refresh_token
              properties:
                refresh_token:
                  type: string
      responses:
        '200':
          description: New tokens
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'
  /auth/consent:
    post:
      tags:
        - Auth
      operationId: recordConsent
      summary: Record the parent's consent to process a child's data
      x-roles:
        - parent
      description: Required before a child profile can start a session (Quebec Law 25).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsentRequest'
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '204':
          description: Consent recorded
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'
  /children:
    get:
      tags:
        - Children
      operationId: listChildren
      summary: List the parent's child profiles
      x-roles:
        - parent
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: Child profiles
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Child'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'
    post:
      tags:
        - Children
      operationId: createChild
      summary: Create a child profile
      x-roles:
        - parent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChildCreate'
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Child'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'
  /children/{childId}:
    parameters:
      - $ref: '#/components/parameters/ChildId'
    get:
      tags:
        - Children
      operationId: getChild
      summary: Get one child profile
      x-roles:
        - parent
        - child
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: The profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Child'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'
    patch:
      tags:
        - Children
      operationId: updateChild
      summary: Update name, avatar or grade
      x-roles:
        - parent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChildUpdate'
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Child'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'
    delete:
      tags:
        - Children
      operationId: deleteChild
      summary: Delete a child profile and all of its data
      x-roles:
        - parent
      description: Irreversible. Removes sessions, mastery, collection and reports.
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '204':
          description: Deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'
  /children/{childId}/token:
    parameters:
      - $ref: '#/components/parameters/ChildId'
    post:
      tags:
        - Children
      operationId: createChildToken
      summary: Switch to a child (play mode)
      x-roles:
        - parent
      description: |
        Returns a child-scoped token. A PIN is required if the profile has one (403 `invalid_pin`). The backend
        should also refuse with 403 `consent_missing` while the parent has not consented; the profile picker
        handles that answer (refusal at session start is the second line of defence).
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                pin:
                  type: string
                  pattern: ^[0-9]{4}$
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: Child token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChildToken'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'
  /children/{childId}/settings:
    parameters:
      - $ref: '#/components/parameters/ChildId'
    get:
      tags:
        - Parent
      operationId: getChildSettings
      summary: Get a child's play settings
      x-roles:
        - parent
        - child
      description: The child token may read (never change) sound and read-aloud so play follows the parent's choices.
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: Settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChildSettings'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'
    put:
      tags:
        - Parent
      operationId: updateChildSettings
      summary: Replace a child's play settings
      x-roles:
        - parent
        - child
      description: |
        A parent replaces everything. A child token may change only its own `music.enabled`, `music.volume` and
        `voice.human_enabled`; every other field in the body is ignored and the stored value is kept. While
        `music.parent_locked` is true the server keeps `music.enabled` false whoever asks.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChildSettings'
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChildSettings'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'
  /children/{childId}/export:
    parameters:
      - $ref: '#/components/parameters/ChildId'
    get:
      tags:
        - Parent
      operationId: exportChildData
      summary: Download all data held about a child (Law 25 access request)
      x-roles:
        - parent
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: JSON export
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'
  /worlds:
    get:
      tags:
        - Catalog
      operationId: listWorlds
      summary: The twenty story worlds
      x-roles:
        - parent
        - child
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: Worlds
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/World'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'
  /skills:
    get:
      tags:
        - Catalog
      operationId: listSkills
      summary: Curriculum skills (PDA), filterable
      x-roles:
        - parent
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - name: world
          in: query
          schema:
            $ref: '#/components/schemas/WorldId'
        - name: grade
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 4
        - name: implemented
          in: query
          description: Only skills that can be played today (a generator exists or at least 8 published bank questions)
          schema:
            type: boolean
      responses:
        '200':
          description: Skills
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Skill'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'
  /children/{childId}/journey:
    parameters:
      - $ref: '#/components/parameters/ChildId'
    get:
      tags:
        - Journey
      operationId: getJourney
      summary: The path of chapters for a child in one world
      x-roles:
        - parent
        - child
      description: |
        Duolingo-style path. Each node is one skill. Node state is derived from
        mastery and the review schedule; it is not a score.
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - name: world
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/WorldId'
      responses:
        '200':
          description: The journey
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Journey'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'
  /children/{childId}/sessions:
    parameters:
      - $ref: '#/components/parameters/ChildId'
    post:
      tags:
        - Sessions
      operationId: startSession
      summary: Start a chapter
      x-roles:
        - child
      description: |
        A session is one chapter of the child's story. The planner picks each
        skill (review, consolidation, new, upkeep) unless `skill_id` is given.
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartSessionRequest'
      responses:
        '201':
          description: Session created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          description: 'subscription_inactive: unpaid, expired or ended subscription (policy block). Problem carries i18n {fr,en}{title,detail}. account_blocked is a 403.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: consent_missing (no consent on file), daily_limit_reached (daily time limit), or account_blocked (the parent is blocked, even when unpaid_policy is allow)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: The child already has an active session
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'
    get:
      tags:
        - Sessions
      operationId: listSessions
      summary: Past sessions, newest first
      x-roles:
        - parent
        - child
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A page of sessions
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Session'
                  next_cursor:
                    type: string
                    nullable: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'
  /sessions/{sessionId}:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    get:
      tags:
        - Sessions
      operationId: getSession
      summary: Session state (use it to resume after a reload)
      x-roles:
        - parent
        - child
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: The session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'
  /sessions/{sessionId}/beats:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    post:
      tags:
        - Sessions
      operationId: nextBeat
      summary: Get the next scene and question
      x-roles:
        - child
      description: |
        Runs the planner, generates a problem, returns the question at once.
        The scene text may still be `pending`: subscribe to the narration
        stream. The answer is never in this response.
        Calling it again while the previous beat is unanswered returns that
        same beat.
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: The still-unanswered current beat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Beat'
        '201':
          description: A new beat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Beat'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Session is paused or completed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'
  /sessions/{sessionId}/beats/{beatId}/answer:
    parameters:
      - $ref: '#/components/parameters/SessionId'
      - $ref: '#/components/parameters/BeatId'
    post:
      tags:
        - Sessions
      operationId: answerBeat
      summary: Submit the child's answer
      x-roles:
        - child
      description: |
        The engine rules on the answer (`Probleme.evaluer`), mastery is
        updated, and the outcome is returned with the story consequence.
        Safe to retry with the same `Idempotency-Key`: the verdict is stored.
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnswerRequest'
      responses:
        '200':
          description: Verdict and consequence
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnswerResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: This beat was already answered
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'
  /sessions/{sessionId}/beats/{beatId}/hint:
    parameters:
      - $ref: '#/components/parameters/SessionId'
      - $ref: '#/components/parameters/BeatId'
    post:
      tags:
        - Sessions
      operationId: requestHint
      summary: Ask for the hint of the open question (BE-70)
      x-roles:
        - child
      description: |
        Curated questions carry a written hint that guides without giving the answer. Only available while the beat
        is unanswered (409 `beat_answered` afterwards) and when `Question.hint_available` is true (404 otherwise).
        Asking never changes the verdict or the mastery estimate today; the client may show a softer mascot pose.
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: The hint text
          content:
            application/json:
              schema:
                type: object
                required:
                  - hint
                properties:
                  hint:
                    type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: This beat was already answered
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'
  /sessions/{sessionId}/beats/{beatId}/narration:
    parameters:
      - $ref: '#/components/parameters/SessionId'
      - $ref: '#/components/parameters/BeatId'
    get:
      tags:
        - Sessions
      operationId: streamNarration
      summary: Stream the scene or the consequence as it is written
      x-roles:
        - child
      description: |
        Server-sent events (`Content-Type: text/event-stream`, `Cache-Control: no-cache`). Each block is
        `event: <name>\ndata: <json>\n\n`. Events:
        - `scene` or `denouement` (the name equals `phase`): `data: {"delta":"text chunk"}`; chunks are about 4 words
          and keep their trailing space so the client can concatenate them as they are.
        - `done`: `data: {}`, last event of a healthy stream, then close.
        - `fallback`: `data: {"text":"full canned text"}`, sent instead of `done` when the model failed or leaked
          an answer. The client shows the text and tells the user the story is simplified. Then close.
        - A comment line `: ping` every 5 s while the model thinks (heartbeat; the client ignores it).
        Add `id: <n>` to every block. A reconnect with `Last-Event-ID: <n>` resumes after that chunk. The client
        reconnects once, from scratch, when the stream drops before `done`.
        `phase=denouement` before the beat is answered returns 409 `beat_not_answered`.
        The first byte must arrive within 3 s; the whole scene within 8 s or send `fallback`. The web proxy
        cuts every request at 15 s.
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - name: phase
          in: query
          required: true
          schema:
            type: string
            enum:
              - scene
              - denouement
        - name: Last-Event-ID
          in: header
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Event stream
          content:
            text/event-stream:
              schema:
                type: string
              example: |+
                event: scene
                data: {"delta":"Zoé et la tour "}

                event: scene
                data: {"delta":"arrivent au pont. "}

                event: done
                data: {}

        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: beat_not_answered (denouement requested too early) or session_completed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'
