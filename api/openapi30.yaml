    get:
      tags:
        - Engagement
      operationId: getDiscover
      summary: The Discover feed, 200 real-world photos, animations and short educational videos in a private random order (BE-80)
      x-roles:
        - child
      description: |
        An endless, cursor paginated feed built from a curated set of 200 items (photos with a fun fact, short
        animations, short captioned videos), each tied to maths in real life or to a wonder fact. The order is random
        per child and never repeats an item until every item suited to the child's grade has been shown; then the
        order is reshuffled (`cycle` grows). No more than two videos follow each other. About one slot in eight is a
        puzzle (`kind: puzzle`, a regular `FeedItem`) so likes, saves and answers keep using the feed operations.
        The cursor is opaque: pass `next_cursor` back unchanged; a cursor the server did not issue is a 422.
        Items are curated by Numerix (never AI generated, never user generated) with source, creator and licence.
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - name: cursor
          in: query
          schema:
            type: string
        - name: seed
          in: query
          description: |
            A fresh random number the app picks each time the child opens or taps the Discover tab. It changes the
            order; send the same seed with every page of one visit. Without it the order is the child's fixed one.
          schema:
            type: integer
            minimum: 0
            maximum: 9007199254740991
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 12
            default: 12
      responses:
        '200':
          description: A page of Discover items
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiscoverPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'
  /feed-media/{file}:
    get:
      tags:
        - Engagement
      operationId: getFeedMedia
      summary: One Discover media file, with HTTP Range for video (BE-81)
      security: []
      description: |
        Files are named `<id>-<8 hex of the content hash>.<ext>` so the bytes behind a URL never change:
        `Cache-Control: public, max-age=31536000, immutable`, a strong `ETag`, 304 for `If-None-Match`, and
        `Range` support (206 and `Accept-Ranges: bytes`) so a browser can start a video before it is downloaded.
        Types: webp and jpg images, mp4 and webm video, `text/vtt` captions. In the web app this path is rewritten
        from `/feed-media/*` like `/assets/*`.
      parameters:
        - name: file
          in: path
          required: true
          schema:
            type: string
            pattern: ^[a-z0-9][a-z0-9._-]{2,100}\.(webp|jpg|mp4|webm|vtt)$
        - name: If-None-Match
          in: header
          required: false
          schema:
            type: string
        - name: Range
          in: header
          required: false
          schema:
            type: string
        - name: If-Range
          in: header
          required: false
          schema:
            type: string
      responses:
        '200':
          description: The whole file
          headers:
            ETag:
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
            Accept-Ranges:
              schema:
                type: string
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '206':
          description: A byte range of the file
          headers:
            ETag:
              schema:
                type: string
            Content-Range:
              schema:
                type: string
            Accept-Ranges:
              schema:
                type: string
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '304':
          description: Not modified
          headers:
            ETag:
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
        '404':
          $ref: '#/components/responses/NotFound'
        '416':
          description: Range not satisfiable
          headers:
            Content-Range:
              schema:
                type: string
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'
