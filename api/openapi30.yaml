  /subscription/checkout:
    post:
      tags:
        - Parent
      operationId: checkoutSubscription
      summary: Start a paid plan (BE-24). The real backend returns the processor's hosted page URL; development completes instantly.
      description: |
        Idempotent: the client sends `Idempotency-Key`; a retry with the same key returns the same
        `checkout_url` (or the same activated subscription) and never creates a second checkout.
        With a processor, the response carries `checkout_url` (https only) and the subscription stays
        unchanged until the processor webhook confirms payment. The app never collects card details.
      x-roles:
        - parent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - plan
                - method
              properties:
                plan:
                  type: string
                  enum:
                    - family_monthly
                    - family_yearly
                method:
                  $ref: '#/components/schemas/PaymentMethod'
            example:
              plan: family_monthly
              method: card
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - name: Idempotency-Key
          in: header
          required: false
          description: Recommended. Not yet sent by the web app (see the guide, known mismatches).
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Subscription after checkout (instant in development), or the current subscription plus `checkout_url` (processor)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutResult'
              examples:
                instant:
                  summary: Completed at once (development)
                  value:
                    status: active
                    plan: family_monthly
                    method: card
                    renews_at: '2026-11-11T14:00:00Z'
                    can_play: true
                    days_left: 30
                hosted:
                  summary: Processor, redirect the browser
                  value:
                    status: trial
                    plan: free
                    trial_ends_at: '2026-10-26T14:00:00Z'
                    can_play: true
                    days_left: 14
                    checkout_url: https://checkout.example-processor.com/c/cs_123
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
