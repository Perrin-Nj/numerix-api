      responses:
        '200':
          description: Notifications, newest first
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                  - unread_count
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Notification'
