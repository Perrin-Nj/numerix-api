      tags:
        - Challenges
      operationId: listChallenges
      summary: The challenge catalogue with this child's progress
      x-roles:
        - child
        - parent
      description: |
        Until this exists the web app derives challenges from the on-device event log. Progress counts only
        events after the child accepted the challenge. Completion awards the card `ch-<challenge id>` once.
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: Challenges, active first, then available, then done
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Challenge'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'
  /children/{childId}/challenges/{challengeId}/accept:
    parameters:
      - $ref: '#/components/parameters/ChildId'
      - name: challengeId
        in: path
        required: true
        schema:
          type: string
