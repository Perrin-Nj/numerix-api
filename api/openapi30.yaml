        label:
          type: string
        ref_pda:
          type: string
        section:
          type: string
        grade_intro:
          type: integer
        grade_mastery:
          type: integer
        cycle:
          type: integer
        prerequisites:
          type: array
          items:
            $ref: '#/components/schemas/SkillId'
        worlds:
          type: array
          items:
            $ref: '#/components/schemas/WorldId'
        implemented:
          type: boolean
          description: The skill can be played today - a generator exists or at least 8 published bank questions exist in some quest
    NodeState:
      type: string
      enum:
        - locked
